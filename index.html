<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>UT Shorts — Urdu Tube</title>
<link rel="icon" href="https://www.urdutubes.com/favicon.ico">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

:root {
  --accent:     #7c6af7;
  --accent-rgb: 124,106,247;
  --radius:     14px;
  --bg:         #080810;
  --surface:    #13131c;
  --border:     rgba(255,255,255,0.07);
  --text:       #eeeef8;
  --text2:      #8888aa;
  --glass:      rgba(8,8,16,0.88);
}

html, body {
  height:100%; width:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,sans-serif;
}

/* ══ SHELL ══ */
#app {
  display:flex; flex-direction:column;
  height:100dvh; width:100%; overflow:hidden;
}

/* ══ TOP BAR ══ */
#topbar {
  flex-shrink:0; height:46px;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 12px;
  background:var(--glass);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
  z-index:100; gap:8px;
}
.tb-left  { display:flex; align-items:center; gap:8px; }
.tb-right { display:flex; align-items:center; gap:6px; }

.tb-logo { display:flex; align-items:center; gap:6px; text-decoration:none; }
.tb-icon {
  width:26px; height:26px;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  border-radius:6px;
  display:flex; align-items:center; justify-content:center; font-size:12px;
}
.tb-name { font-size:13px; font-weight:700; color:#fff; }

.tb-back {
  display:flex; align-items:center; gap:4px;
  padding:4px 10px; border-radius:20px;
  background:rgba(255,255,255,0.06); border:1px solid var(--border);
  color:var(--text2); font-size:11px; font-weight:600;
  cursor:pointer; text-decoration:none; transition:all .2s;
}
.tb-back:hover { color:#fff; border-color:var(--accent); }

.tb-counter {
  font-size:11px; color:var(--text2);
  background:rgba(255,255,255,0.05);
  padding:3px 9px; border-radius:20px; border:1px solid var(--border);
}

/* ══ CAT BAR ══ */
#catbar {
  flex-shrink:0;
  display:flex; align-items:center; gap:5px;
  padding:5px 10px;
  overflow-x:auto; scrollbar-width:none;
  background:rgba(8,8,16,0.92);
  border-bottom:1px solid var(--border);
}
#catbar::-webkit-scrollbar { display:none; }
.c-pill {
  flex-shrink:0;
  padding:4px 12px; border-radius:20px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.05);
  color:var(--text2); font-size:11px; font-weight:500;
  cursor:pointer; transition:all .2s; white-space:nowrap;
}
.c-pill:hover { color:#fff; border-color:var(--accent); }
.c-pill.on { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }

/* ══ FEED AREA ══ */
#feed-area {
  flex:1; overflow:hidden; position:relative;
  display:flex; align-items:center; justify-content:center;
  background:var(--bg);
}

/* ══ VERTICAL FEED (TikTok / YouTube Shorts) ══ */
.v-feed {
  position:absolute; inset:0;
  overflow-y:scroll;
  scroll-snap-type:y mandatory;
  scrollbar-width:none;
  display:flex; flex-direction:column;
}
.v-feed::-webkit-scrollbar { display:none; }

.v-slide {
  flex-shrink:0; width:100%; height:100%;
  scroll-snap-align:start; scroll-snap-stop:always;
  display:flex; align-items:center; justify-content:center;
  position:relative; background:var(--bg);
}

/* ══════════════════════════════════════
   VIDEO WRAP — TikTok / YouTube Shorts
   9:16 aspect, scales up on big screens
══════════════════════════════════════ */
.v-wrap {
  width:100%;
  max-width:420px;
  aspect-ratio:9/16;
  max-height:100%;
  border-radius:var(--radius);
  overflow:hidden;
  position:relative;
  background:#000;
  box-shadow:0 0 60px rgba(var(--accent-rgb),.18), 0 20px 60px rgba(0,0,0,.7);
}

/* 🔥 DESKTOP BOOST */
@media (min-width:768px)  { .v-wrap { max-width:520px; } }
@media (min-width:1024px) { .v-wrap { max-width:600px; } }
@media (min-width:1400px) { .v-wrap { max-width:680px; } }

/* Mobile — full screen, no radius */
@media (max-width:500px) {
  .v-wrap { max-width:100%; border-radius:0; }
}

.v-wrap iframe {
  position:absolute; inset:0;
  width:100%; height:100%; border:none;
}

/* ── Thumbnail overlay ── */
.v-thumb {
  position:absolute; inset:0; z-index:4;
  background:#000;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:opacity .25s;
}
.v-thumb img {
  position:absolute; inset:0;
  width:100%; height:100%; object-fit:cover; opacity:.85;
}
.v-thumb-play {
  position:relative; z-index:2;
  width:66px; height:66px;
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(8px);
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:26px;
  border:2px solid rgba(255,255,255,.35);
  transition:transform .15s, background .15s;
}
.v-thumb:hover .v-thumb-play { transform:scale(1.1); background:rgba(255,255,255,.28); }

/* ── Bottom meta overlay ── */
.v-meta {
  position:absolute; bottom:0; left:0; right:52px;
  padding:55px 14px 16px;
  background:linear-gradient(to top,rgba(0,0,0,.9) 0%,transparent);
  z-index:5; pointer-events:none;
}
.v-cat-tag {
  display:inline-block;
  font-size:10px; font-weight:700; letter-spacing:.7px; text-transform:uppercase;
  color:var(--accent);
  background:rgba(var(--accent-rgb),.15);
  border:1px solid rgba(var(--accent-rgb),.3);
  border-radius:20px; padding:2px 8px; margin-bottom:5px;
}
.v-title {
  font-size:14px; font-weight:700; line-height:1.35; color:#fff;
  text-shadow:0 1px 6px rgba(0,0,0,.7);
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.v-desc {
  font-size:11px; color:rgba(255,255,255,.55); margin-top:4px; line-height:1.4;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}

/* ── Platform badge ── */
.v-platb {
  position:absolute; top:10px; left:10px;
  font-size:9px; font-weight:700; letter-spacing:.4px;
  padding:3px 8px; border-radius:20px; z-index:6; pointer-events:none;
}
.v-platb.youtube     { background:rgba(255,0,0,.22);   color:#ff8080; border:1px solid rgba(255,0,0,.25); }
.v-platb.dailymotion { background:rgba(0,148,255,.22); color:#80d4ff; border:1px solid rgba(0,148,255,.25); }

/* ── Side action buttons ── */
.v-side {
  position:absolute; right:8px; bottom:20px;
  display:flex; flex-direction:column;
  align-items:center; gap:14px; z-index:6;
}
.v-btn {
  display:flex; flex-direction:column; align-items:center; gap:3px;
  cursor:pointer; color:rgba(255,255,255,.8);
  transition:transform .15s, color .15s; text-decoration:none;
}
.v-btn:hover { color:#fff; transform:scale(1.1); }
.v-btn:active { transform:scale(.92); }
.v-icon {
  width:40px; height:40px;
  background:rgba(255,255,255,.13);
  backdrop-filter:blur(6px); border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-size:.9rem;
  border:1px solid rgba(255,255,255,.12);
}
.v-lbl { font-size:.56rem; font-weight:500; color:rgba(255,255,255,.65); }

/* ══ UP / DOWN BUTTONS (ShiaTV style) ══ */
.nav-btn {
  position:fixed; right:18px;
  width:46px; height:46px; border-radius:50%;
  background:rgba(var(--accent-rgb),.85);
  border:none; color:#fff; font-size:20px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; z-index:200;
  box-shadow:0 4px 16px rgba(var(--accent-rgb),.4);
  transition:transform .15s, background .15s;
  user-select:none;
}
.nav-btn:hover  { transform:scale(1.08); background:rgba(var(--accent-rgb),1); }
.nav-btn:active { transform:scale(.92); }
#navUp   { bottom:76px; }
#navDown { bottom:22px; }

@media (max-width:500px) {
  .nav-btn { width:40px; height:40px; right:10px; font-size:17px; }
  #navUp   { bottom:68px; }
  #navDown { bottom:18px; }
}

/* ══ SCROLL HINT ══ */
.scroll-hint {
  position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
  display:flex; flex-direction:column; align-items:center; gap:2px;
  color:rgba(255,255,255,.3); font-size:.6rem;
  animation:hintFade 3s ease forwards 3s;
  pointer-events:none; z-index:7;
}
.hint-arr { font-size:.95rem; animation:bounce 1s ease infinite; }
@keyframes bounce   { 0%,100%{transform:translateY(0)} 50%{transform:translateY(4px)} }
@keyframes hintFade { 0%{opacity:1} 100%{opacity:0} }

/* ══ STATES ══ */
.state-box {
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  height:100%; gap:12px; color:var(--text2); text-align:center; padding:20px;
}
.spinner {
  width:36px; height:36px;
  border:2px solid var(--border); border-top-color:var(--accent);
  border-radius:50%; animation:spin .7s linear infinite;
}
@keyframes spin { to{transform:rotate(360deg);} }
.err-retry {
  margin-top:6px; padding:7px 18px;
  background:var(--accent); color:#fff;
  border:none; border-radius:20px; cursor:pointer; font-size:13px; font-weight:600;
}
</style>
</head>
<body>
<div id="app">

  <!-- TOP BAR -->
  <div id="topbar">
    <div class="tb-left">
      <a class="tb-logo" href="https://www.urdutubes.com">
        <div class="tb-icon">⚡</div>
        <span class="tb-name">UT Shorts</span>
      </a>
      <a class="tb-back" href="https://www.urdutubes.com/p/shorts.html">← Browse</a>
    </div>
    <div class="tb-right">
      <div class="tb-counter" id="tbCounter">Loading…</div>
    </div>
  </div>

  <!-- CATEGORY BAR -->
  <div id="catbar"></div>

  <!-- FEED -->
  <div id="feed-area">
    <div class="state-box">
      <div class="spinner"></div>
      <div>Loading shorts…</div>
    </div>
  </div>

</div>

<!-- UP / DOWN NAV (ShiaTV style) -->
<button class="nav-btn" id="navUp"   aria-label="Previous video">↑</button>
<button class="nav-btn" id="navDown" aria-label="Next video">↓</button>

<script>
(function(){
'use strict';

/* ══ CONFIG ══ */
const SHEET_ID  = "1tj3xg0toFl8vT_O0SFQY2inq6XZqKRSqPMGlgcbLXMI";
const GID       = "102941964";
const SHORTS    = "https://shorts.urdutubes.com";
const CACHE_KEY = "uta_shorts_v4";
const CACHE_TTL = 2 * 60 * 1000; /* ✅ 2 minutes */

/* ══ STATE ══ */
let allVids   = [];
let playlist  = [];
let curIdx    = 0;
let activeCat = "All";
let startVid  = null;  /* video to play first */
let feedEl    = null;
let iObs      = null;

const $ = id => document.getElementById(id);

/* ══ READ URL PARAMS ══ */
function readParams(){
  const p   = new URLSearchParams(window.location.search);
  /* Support: ?cat=Islamic&v=videoId */
  let cat   = p.get("cat") || "";
  let vid   = p.get("v")   || "";

  /* Also support clean path: /islamic/x6gqkqq */
  const path = location.pathname.replace(/^\/+/,"").split("/").filter(Boolean);
  if(!cat && path[0]) cat = path[0];
  if(!vid && path[1]) vid = path[1];

  activeCat = cat || "All";
  startVid  = vid || null;
}

/* ══ EMBED URLS ══ */
function embedPlay(v){
  if(v.platform==="youtube")
    return `https://www.youtube.com/embed/${v.id}?autoplay=1&rel=0&modestbranding=1&playsinline=1`;
  return `https://www.dailymotion.com/embed/video/${v.id}?autoplay=1&ui-logo=false&sharing-enable=false&queue-enable=false`;
}
function embedPause(v){
  if(v.platform==="youtube")
    return `https://www.youtube.com/embed/${v.id}?autoplay=0&rel=0`;
  return `https://www.dailymotion.com/embed/video/${v.id}?autoplay=0&queue-enable=false`;
}
function thumbUrl(v){
  if(v.thumbnail) return v.thumbnail;
  if(v.platform==="youtube") return `https://img.youtube.com/vi/${v.id}/mqdefault.jpg`;
  return "";
}
function platLbl(p){ return p==="youtube"?"▶ YouTube":"◆ Dailymotion"; }

/* ══ SHUFFLE ══ */
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

/* ══ BUILD PLAYLIST ══
   Rules:
   1. If startVid set → that video first, ALWAYS
   2. If category != All → that cat's videos (shuffled) first, then ALL other videos (shuffled)
      This means even 2-video categories will continue with other videos after
   3. All → everything shuffled
*/
function buildPlaylist(){
  let catVids, otherVids;

  if(activeCat === "All"){
    catVids   = [];
    otherVids = shuffle([...allVids]);
  } else {
    catVids   = shuffle(allVids.filter(v => v.category === activeCat));
    otherVids = shuffle(allVids.filter(v => v.category !== activeCat));
  }

  let ordered = [...catVids, ...otherVids];

  /* ✅ Put startVid first */
  if(startVid){
    const idx = ordered.findIndex(v => v.id === startVid);
    if(idx > 0){
      const [found] = ordered.splice(idx, 1);
      ordered.unshift(found);
    } else if(idx === -1){
      /* video not in current list — find in allVids and prepend */
      const found = allVids.find(v => v.id === startVid);
      if(found) ordered.unshift(found);
    }
  }

  return ordered;
}

/* ══ CATEGORIES ══ */
function getCats(){
  const s = new Set(["All"]);
  allVids.forEach(v=>{ if(v.category) s.add(v.category.trim()); });
  return Array.from(s);
}

function renderCats(){
  const bar = $("catbar"); bar.innerHTML="";
  const cats = getCats();
  /* Validate activeCat */
  if(!cats.includes(activeCat)) activeCat="All";

  cats.forEach(c=>{
    const b = document.createElement("button");
    b.className = "c-pill"+(c===activeCat?" on":"");
    b.textContent = c;
    b.onclick = ()=>{
      activeCat = c;
      startVid  = null; /* reset start video on cat change */
      renderCats();
      rebuildFeed();
    };
    bar.appendChild(b);
  });
}

/* ══ REBUILD FEED ══ */
function rebuildFeed(){
  playlist = buildPlaylist();
  curIdx   = 0;
  renderFeed();
}

/* ══ RENDER FEED ══ */
function renderFeed(){
  const area = $("feed-area");
  area.innerHTML = "";

  if(!playlist.length){
    area.innerHTML=`<div class="state-box"><div style="font-size:2rem">📭</div><div>No videos found</div></div>`;
    updateCounter(); return;
  }

  feedEl = document.createElement("div");
  feedEl.className = "v-feed";
  playlist.forEach((v,i) => feedEl.appendChild(buildSlide(v,i)));
  area.appendChild(feedEl);

  setupObserver();
  setupScroll();
  updateCounter();
}

/* ══ BUILD SLIDE ══ */
function buildSlide(v, idx){
  const slide = document.createElement("div");
  slide.className = "v-slide";
  slide.dataset.idx = idx;

  const wrap = document.createElement("div");
  wrap.className = "v-wrap";

  /* iframe — starts blank, src set by observer */
  const iframe = document.createElement("iframe");
  iframe.allow = "autoplay; fullscreen; encrypted-media; picture-in-picture";
  iframe.allowFullscreen = true;
  iframe.dataset.play  = embedPlay(v);
  iframe.dataset.pause = embedPause(v);
  iframe.src = "about:blank";

  /* Thumbnail overlay */
  const thumb = document.createElement("div");
  thumb.className = "v-thumb";
  const tu = thumbUrl(v);
  if(tu){
    const img = document.createElement("img");
    img.src = tu; img.alt = v.title; img.loading="lazy";
    thumb.appendChild(img);
  } else {
    thumb.style.background = "#1a1a2e";
  }
  const pb = document.createElement("div");
  pb.className = "v-thumb-play"; pb.textContent = "▶";
  thumb.appendChild(pb);

  /* ✅ Click thumb → play */
  thumb.addEventListener("click", ()=>{
    iframe.src = iframe.dataset.play;
    thumb.style.opacity = "0";
    setTimeout(()=>{ thumb.style.display="none"; }, 280);
  });

  /* Platform badge */
  const platb = document.createElement("div");
  platb.className = `v-platb ${v.platform}`;
  platb.textContent = platLbl(v.platform);

  /* Meta */
  const meta = document.createElement("div");
  meta.className = "v-meta";
  meta.innerHTML = `
    <div class="v-cat-tag">${v.category}</div>
    <div class="v-title">${v.title}</div>
    ${v.description?`<div class="v-desc">${v.description}</div>`:""}`;

  /* Side buttons */
  const side = document.createElement("div");
  side.className = "v-side";

  const shareBtn = document.createElement("div");
  shareBtn.className = "v-btn";
  shareBtn.innerHTML = `<div class="v-icon">↗</div><div class="v-lbl">Share</div>`;
  shareBtn.onclick = ()=>{
    const url = `${SHORTS}/${v.category.toLowerCase().replace(/\s+/g,"-")}/${v.id}`;
    if(navigator.share) navigator.share({title:v.title, url});
    else { navigator.clipboard?.writeText(url); alert("Link copied!"); }
  };

  const srcBtn = document.createElement("a");
  srcBtn.className = "v-btn";
  srcBtn.innerHTML = `<div class="v-icon">⎋</div><div class="v-lbl">Source</div>`;
  srcBtn.href = v.platform==="youtube"
    ? `https://www.youtube.com/watch?v=${v.id}`
    : `https://www.dailymotion.com/video/${v.id}`;
  srcBtn.target="_blank"; srcBtn.rel="noopener";

  side.appendChild(shareBtn);
  side.appendChild(srcBtn);

  if(idx===0){
    const hint = document.createElement("div");
    hint.className = "scroll-hint";
    hint.innerHTML = `<div class="hint-arr">↓</div><span>Swipe</span>`;
    wrap.appendChild(hint);
  }

  wrap.appendChild(iframe);
  wrap.appendChild(thumb);
  wrap.appendChild(platb);
  wrap.appendChild(meta);
  wrap.appendChild(side);
  slide.appendChild(wrap);
  return slide;
}

/* ══ INTERSECTION OBSERVER — auto play/pause ══ */
function setupObserver(){
  if(iObs){ iObs.disconnect(); iObs=null; }

  iObs = new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      const slide  = entry.target;
      const idx    = parseInt(slide.dataset.idx);
      const iframe = slide.querySelector("iframe");
      const thumb  = slide.querySelector(".v-thumb");
      if(!iframe) return;

      if(entry.isIntersecting){
        curIdx = idx;
        updateCounter();

        /* ✅ Auto play: hide thumb, load iframe */
        if(iframe.src === "about:blank"){
          iframe.src = iframe.dataset.play;
        }
        if(thumb && thumb.style.display !== "none"){
          thumb.style.opacity = "0";
          setTimeout(()=>{ if(thumb) thumb.style.display="none"; }, 280);
        }
      } else {
        /* ✅ Pause: reset to blank to stop audio/video */
        if(iframe.src !== "about:blank"){
          iframe.src = "about:blank";
          if(thumb){
            thumb.style.display = "flex";
            thumb.style.opacity = "1";
          }
        }
      }
    });
  }, { threshold: 0.65 });

  feedEl.querySelectorAll(".v-slide").forEach(s => iObs.observe(s));
}

/* ══ SCROLL EVENTS ══ */
function setupScroll(){
  if(!feedEl) return;

  /* Wheel — one slide at a time */
  feedEl.addEventListener("wheel", e=>{
    e.preventDefault();
    feedEl.scrollBy({ top: e.deltaY>0 ? feedEl.clientHeight : -feedEl.clientHeight, behavior:"smooth" });
  },{ passive:false });

  /* Touch swipe */
  let ty=0;
  feedEl.addEventListener("touchstart", e=>{ ty=e.touches[0].clientY; },{ passive:true });
  feedEl.addEventListener("touchend",   e=>{
    const diff = ty - e.changedTouches[0].clientY;
    if(Math.abs(diff)>40)
      feedEl.scrollBy({ top: diff>0 ? feedEl.clientHeight : -feedEl.clientHeight, behavior:"smooth" });
  },{ passive:true });

  /* Keyboard */
  document.addEventListener("keydown", e=>{
    if(!feedEl) return;
    if(e.key==="ArrowDown"||e.key==="ArrowRight")
      feedEl.scrollBy({ top:  feedEl.clientHeight, behavior:"smooth" });
    else if(e.key==="ArrowUp"||e.key==="ArrowLeft")
      feedEl.scrollBy({ top: -feedEl.clientHeight, behavior:"smooth" });
  });
}

/* ══ NAV BUTTONS ══ */
$("navDown").onclick = ()=>{ if(feedEl) feedEl.scrollBy({ top:  feedEl.clientHeight, behavior:"smooth" }); };
$("navUp").onclick   = ()=>{ if(feedEl) feedEl.scrollBy({ top: -feedEl.clientHeight, behavior:"smooth" }); };

/* ══ COUNTER ══ */
function updateCounter(){
  const t = playlist.length;
  $("tbCounter").textContent = t ? `${Math.min(curIdx+1,t)} / ${t}` : "—";
}

/* ══ LOAD SHEET ══ */
async function loadSheet(){
  try{
    const c = localStorage.getItem(CACHE_KEY);
    if(c){
      const {data,ts} = JSON.parse(c);
      if(Date.now()-ts < CACHE_TTL && data.length>0) return data;
    }
  }catch(e){}

  /* Bust Google cache with timestamp */
  const BASE = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${GID}&nocache=${Date.now()}`;
  const URLS = [
    BASE,
    `https://corsproxy.io/?${encodeURIComponent(BASE)}`,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(BASE)}`
  ];

  function parse(text){
    try{
      const m = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*?)\);?\s*$/);
      if(!m) return null;
      const json = JSON.parse(m[1]);
      return json.table.rows
        .filter(r=>r.c[0]&&r.c[0].v&&String(r.c[0].v).trim().toLowerCase()!=="video_id")
        .map(r=>({
          id:          String(r.c[0].v).trim(),
          platform:    String(r.c[1]?.v||"youtube").toLowerCase().trim(),
          title:       String(r.c[2]?.v||"Untitled").trim(),
          category:    String(r.c[3]?.v||"General").trim(),
          description: String(r.c[4]?.v||"").trim().slice(0,150),
          tags:        String(r.c[5]?.v||"").trim(),
          thumbnail:   String(r.c[6]?.v||"").trim(),
          featured:    String(r.c[7]?.v||"").toLowerCase().trim()==="yes",
        }));
    }catch(e){ return null; }
  }

  function ft(url, ms=10000){
    return Promise.race([
      fetch(url,{cache:"no-store"}),
      new Promise((_,r)=>setTimeout(()=>r(new Error("timeout")),ms))
    ]);
  }

  return new Promise(resolve=>{
    let done=false, pending=URLS.length;
    URLS.forEach(url=>{
      ft(url).then(r=>r.text()).then(text=>{
        if(done) return;
        if(text&&text.length>20&&!text.trim().startsWith("<!DOCTYPE")){
          const data=parse(text);
          if(data&&data.length>0){
            done=true;
            try{ localStorage.setItem(CACHE_KEY,JSON.stringify({data,ts:Date.now()})); }catch(e){}
            resolve(data);
          }
        }
      }).catch(()=>{}).finally(()=>{ pending--; if(pending===0&&!done) resolve([]); });
    });
  });
}

/* ══ INIT ══ */
async function init(){
  readParams();

  allVids = await loadSheet();

  if(!allVids.length){
    $("feed-area").innerHTML=`<div class="state-box">
      <div style="font-size:2rem">📭</div>
      <div>Could not load videos</div>
      <button class="err-retry" onclick="location.reload()">Retry</button>
    </div>`;
    return;
  }

  /* Match activeCat slug to actual category name (case-insensitive) */
  if(activeCat !== "All"){
    const cats = getCats();
    const match = cats.find(c =>
      c.toLowerCase().replace(/\s+/g,"-") === activeCat.toLowerCase().replace(/\s+/g,"-")
    );
    activeCat = match || "All";
  }

  renderCats();
  rebuildFeed();
}

init();

})();
</script>
