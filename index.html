<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shorts Player</title>

<style>
:root{
  --accent:#7c6af7;
}

/* ===== RESET ===== */
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#020617;
  font-family:system-ui;
  overflow:hidden;
}

/* ===== FEED ===== */
.v-feed{
  height:100vh;
  overflow-y:auto;
  scroll-snap-type:y mandatory;
}

/* ===== SLIDE ===== */
.v-slide{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  scroll-snap-align:start;
  position:relative;
  background:radial-gradient(circle at center, rgba(124,106,247,0.2), transparent 60%);
}

/* ===== PLAYER ===== */
.v-wrap{
  width:100%;
  max-width:420px;
  height:90vh;
  border-radius:20px;
  overflow:hidden;
  background:#000;
  position:relative;

  box-shadow:
    0 0 80px rgba(124,106,247,.25),
    0 20px 80px rgba(0,0,0,.8);
}

/* DESKTOP BOOST */
@media(min-width:768px){ .v-wrap{max-width:520px;} }
@media(min-width:1024px){ .v-wrap{max-width:600px;} }
@media(min-width:1400px){ .v-wrap{max-width:680px;} }

/* ===== VIDEO ===== */
.v-wrap iframe{
  width:100%;
  height:100%;
  border:0;
}

/* ===== META ===== */
.v-meta{
  position:absolute;
  bottom:20px;
  left:20px;
  color:#fff;
}

.v-title{
  font-size:18px;
  font-weight:600;
}

/* ===== ACTIONS ===== */
.v-actions{
  position:absolute;
  right:20px;
  bottom:120px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.v-btn{
  width:44px;
  height:44px;
  border-radius:50%;
  background:rgba(255,255,255,0.1);
  display:flex;
  align-items:center;
  justify-content:center;
  backdrop-filter:blur(10px);
  cursor:pointer;
}

/* ===== HOVER ===== */
.v-wrap:hover{
  transform:scale(1.02);
  transition:0.3s;
}
</style>
</head>

<body>

<div class="v-feed" id="feed">

  <!-- VIDEO 1 -->
  <div class="v-slide">
    <div class="v-wrap">
      <iframe data-src="https://www.dailymotion.com/embed/video/x6gqkqq?autoplay=0&mute=1"></iframe>
      <div class="v-meta">
        <div class="v-title">Gulistan Palace Tehran</div>
      </div>
    </div>
  </div>

  <!-- VIDEO 2 -->
  <div class="v-slide">
    <div class="v-wrap">
      <iframe data-src="https://www.dailymotion.com/embed/video/x7xxxxxx?autoplay=0&mute=1"></iframe>
      <div class="v-meta">
        <div class="v-title">Another Video</div>
      </div>
    </div>
  </div>

</div>

<script>

/* ===== AUTO PLAY CENTER ===== */
const slides = document.querySelectorAll(".v-wrap");

const observer = new IntersectionObserver(entries=>{
  entries.forEach(entry=>{
    const iframe = entry.target.querySelector("iframe");

    if(entry.isIntersecting){
      if(!iframe.src){
        iframe.src = iframe.dataset.src.replace("autoplay=0","autoplay=1");
      }
    }else{
      iframe.src = iframe.dataset.src; // reset
    }
  });
},{threshold:0.7});

slides.forEach(el=>observer.observe(el));

/* ===== SMOOTH SCROLL ===== */
const feed = document.getElementById("feed");

feed.addEventListener("wheel", e=>{
  e.preventDefault();
  feed.scrollBy({
    top: e.deltaY > 0 ? window.innerHeight : -window.innerHeight,
    behavior:"smooth"
  });
},{passive:false});

/* ===== TOUCH SWIPE ===== */
let startY=0;

feed.addEventListener("touchstart",e=>{
  startY=e.touches[0].clientY;
});

feed.addEventListener("touchend",e=>{
  let endY=e.changedTouches[0].clientY;
  let diff=startY-endY;

  if(Math.abs(diff)>50){
    feed.scrollBy({
      top: diff>0 ? window.innerHeight : -window.innerHeight,
      behavior:"smooth"
    });
  }
});

</script>

</body>
</html>
