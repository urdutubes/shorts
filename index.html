<html lang="en">
<head>

<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

:root {
  --accent:     #7c6af7;
  --accent2:    #f76a8a;
  --accent-rgb: 124,106,247;
  --radius:     14px;
  --ease:       cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"] {
  --bg:      #080810;
  --surface: #13131c;
  --surf2:   #1c1c28;
  --surf3:   #242434;
  --text:    #eeeef8;
  --text2:   #8888aa;
  --border:  rgba(255,255,255,0.07);
  --glass:   rgba(10,10,18,0.92);
}
[data-theme="light"] {
  --bg:      #f2f2fb;
  --surface: #ffffff;
  --surf2:   #eaeaf6;
  --surf3:   #e0e0f0;
  --text:    #111128;
  --text2:   #666688;
  --border:  rgba(0,0,0,0.08);
  --glass:   rgba(242,242,251,0.92);
}

/* ── SITE MENU ── */
#sitemenu { flex-shrink:0; background:#0d0d18; border-bottom:1px solid rgba(255,255,255,0.06); overflow-x:auto; scrollbar-width:none; white-space:nowrap; }
#sitemenu::-webkit-scrollbar { display:none; }
.sm-inner { display:inline-flex; align-items:center; gap:2px; padding:0 10px; min-width:100%; }
.sm-link { display:inline-block; padding:7px 12px; color:rgba(255,255,255,0.6); font-size:0.72rem; font-weight:500; text-decoration:none; border-radius:6px; transition:all 0.2s; white-space:nowrap; }
.sm-link:hover { color:#fff; background:rgba(255,255,255,0.07); }
.sm-link.home { color:var(--accent); font-weight:700; }
.sm-link.home:hover { background:rgba(var(--accent-rgb),0.12); }
.sm-divider { width:1px; height:14px; background:rgba(255,255,255,0.1); flex-shrink:0; margin:0 2px; }
[data-theme="light"] #sitemenu { background:#1a1a2e; }

html, body { height:100%; width:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:'Outfit',sans-serif; transition:background .25s var(--ease),color .25s var(--ease); }

/* ── SHELL ── */
#app { display:flex; flex-direction:column; height:100dvh; width:100%; overflow:hidden; }

/* ── TOP BAR ── */
#topbar { flex-shrink:0; height:52px; display:flex; align-items:center; justify-content:space-between; padding:0 14px; background:var(--glass); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border-bottom:1px solid var(--border); z-index:50; gap:10px; }
.back-btn { display:flex; align-items:center; gap:5px; padding:6px 12px; border-radius:20px; background:var(--surf2); border:1px solid var(--border); color:var(--text2); font-size:0.78rem; font-weight:600; cursor:pointer; text-decoration:none; transition:all .2s var(--ease); white-space:nowrap; flex-shrink:0; }
.back-btn:hover { color:var(--text); border-color:var(--accent); }
.back-btn span { font-size:1rem; }
.logo { display:flex; align-items:center; flex-shrink:0; }
.topbar-right { display:flex; align-items:center; gap:6px; flex-shrink:0; }
.icon-btn { width:34px; height:34px; border-radius:50%; background:var(--surf2); border:1px solid var(--border); color:var(--text2); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:0.85rem; transition:all .2s var(--ease); }
.icon-btn:hover { color:var(--text); border-color:var(--accent); }

/* ── CATEGORY BAR ── */
#catbar { flex-shrink:0; display:flex; align-items:center; gap:6px; padding:7px 14px; overflow-x:auto; scrollbar-width:none; background:var(--bg); border-bottom:1px solid var(--border); }
#catbar::-webkit-scrollbar { display:none; }
.cat-pill { flex-shrink:0; padding:5px 14px; border-radius:20px; border:1px solid var(--border); background:var(--surface); color:var(--text2); font-size:0.76rem; font-weight:500; cursor:pointer; transition:all .2s var(--ease); white-space:nowrap; }
.cat-pill:hover { color:var(--text); border-color:var(--accent); }
.cat-pill.on { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }

/* ── CONTENT ── */
#content { flex:1; overflow:hidden; position:relative; background:var(--bg); }

/* ── STATE ── */
.state-box { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:12px; color:var(--text2); }
.state-icon { font-size:2.5rem; opacity:.4; }
.state-text { font-size:.88rem; }
.spinner { width:34px; height:34px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* ═══════════════════════════════════════
   VERTICAL FEED — TikTok / Reels / Shorts
═══════════════════════════════════════ */
.v-feed { height:100%; width:100%; overflow-y:scroll; scroll-snap-type:y mandatory; scrollbar-width:none; }
.v-feed::-webkit-scrollbar { display:none; }

.v-slide { height:100%; width:100%; scroll-snap-align:start; scroll-snap-stop:always; display:flex; align-items:center; justify-content:center; position:relative; background:var(--bg); }

/* Mobile — full screen like Facebook Reels */
@media (max-width:500px) {
  .v-slide { padding:0; background:#000; }
  .v-wrap  { max-width:100% !important; border-radius:0 !important; }
}

/* Desktop — big centered portrait player */
.v-wrap {
  width:100%;
  max-width:420px;
  aspect-ratio:9/16;
  max-height:100%;
  border-radius:var(--radius);
  overflow:hidden;
  position:relative;
  background:#000;
  box-shadow:0 0 60px rgba(var(--accent-rgb),.2);
}
@media (min-width:768px)  { .v-wrap { max-width:520px; } }
@media (min-width:1024px) { .v-wrap { max-width:600px; } }
@media (min-width:1400px) { .v-wrap { max-width:680px; } }

.v-wrap iframe { width:100%; height:100%; border:none; display:block; }

/* Thumbnail overlay — click to play */
.v-thumb { position:absolute; inset:0; z-index:4; background:#000; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:opacity .25s; }
.v-thumb img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.88; }
.v-thumb-play { position:relative; z-index:2; width:64px; height:64px; background:rgba(255,255,255,.18); backdrop-filter:blur(8px); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:26px; border:2px solid rgba(255,255,255,.35); transition:transform .15s,background .15s; }
.v-thumb:hover .v-thumb-play { transform:scale(1.1); background:rgba(255,255,255,.28); }

/* Meta overlay */
.v-info { position:absolute; bottom:0; left:0; right:0; padding:50px 12px 14px; background:linear-gradient(to top,rgba(0,0,0,.9) 0%,transparent); border-radius:0 0 var(--radius) var(--radius); pointer-events:none; z-index:5; }
.v-tag { display:inline-block; font-size:.62rem; font-weight:700; letter-spacing:.8px; text-transform:uppercase; color:var(--accent); background:rgba(var(--accent-rgb),.18); border:1px solid rgba(var(--accent-rgb),.3); border-radius:20px; padding:2px 9px; margin-bottom:5px; }
.v-title { font-family:'Syne',sans-serif; font-weight:700; font-size:.9rem; line-height:1.3; color:#fff; text-shadow:0 1px 6px rgba(0,0,0,.6); }

/* Side buttons */
.v-side { position:absolute; right:4px; bottom:60px; display:flex; flex-direction:column; gap:12px; align-items:center; z-index:6; }
.v-btn { display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; color:rgba(255,255,255,.75); transition:color .15s,transform .15s; }
.v-btn:hover { color:#fff; transform:scale(1.1); }
.v-btn:active { transform:scale(.93); }
.v-icon { width:38px; height:38px; background:rgba(255,255,255,.12); backdrop-filter:blur(6px); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.88rem; border:1px solid rgba(255,255,255,.1); }
.v-lbl { font-size:.58rem; font-weight:500; }

/* Platform badge */
.v-plat { position:absolute; top:9px; right:9px; font-size:.6rem; font-weight:600; letter-spacing:.3px; padding:2px 8px; border-radius:20px; pointer-events:none; z-index:6; }
.v-plat.youtube     { background:rgba(255,0,0,.2);     color:#ff6b6b; border:1px solid rgba(255,0,0,.2); }
.v-plat.dailymotion { background:rgba(0,148,255,.2);   color:#5bc4ff; border:1px solid rgba(0,148,255,.2); }

/* Scroll hint */
.scroll-hint { position:absolute; bottom:8px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:2px; color:rgba(255,255,255,.3); font-size:.62rem; animation:hintFade 3s ease forwards 2.5s; pointer-events:none; z-index:7; }
.hint-arrow { animation:bounce 1s ease infinite; font-size:.9rem; }
@keyframes bounce   { 0%,100%{transform:translateY(0)} 50%{transform:translateY(3px)} }
@keyframes hintFade { 0%{opacity:1} 100%{opacity:0} }

/* Up/Down nav buttons */
.v-nav-btn { position:fixed; width:44px; height:44px; border-radius:50%; background:rgba(var(--accent-rgb),.82); border:none; color:#fff; font-size:20px; display:none; align-items:center; justify-content:center; cursor:pointer; z-index:200; box-shadow:0 4px 16px rgba(var(--accent-rgb),.4); transition:transform .15s,background .15s; user-select:none; }
.v-nav-btn:hover  { transform:scale(1.08); background:rgba(var(--accent-rgb),1); }
.v-nav-btn:active { transform:scale(.92); }
#vNavUp   { bottom:calc(50% + 30px); }
#vNavDown { top:calc(50% + 30px); }
@media (min-width:501px) { .v-nav-btn { display:flex; } }

@keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
</style>
</head>

<script>
(function(){
'use strict';

const SHEET_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRcsxQ0Cx9Z0mJjC8zh-No0U7KeYRvX5D5BfTg2o-PrsNzb7I2CRYQD2bRP7BbPi_z4M9WRNgH5E8t0/pub?gid=102941964&single=true&output=csv";
const SHEET_ID  = "1tj3xg0toFl8vT_O0SFQY2inq6XZqKRSqPMGlgcbLXMI";
const GID       = "102941964";
const CACHE_KEY = "uta_shorts_v7";
const CACHE_TTL = 2 * 60 * 1000;

let videos=[], cat="All", startVid=null, vFeedEl=null, vObs=null;

const $=id=>document.getElementById(id);

function readURL(){
  const path=window.location.pathname.replace(/^\//,"").split("/").filter(Boolean);
  const p=new URLSearchParams(window.location.search);
  let urlCat=p.get("cat")||"", urlId=p.get("v")||"";
  if(!urlCat&&path[0]&&path[0]!=="index.html") urlCat=path[0];
  if(!urlId&&path[1]) urlId=path[1];
  return {urlCat,urlId};
}
function setURL(c,id){
  const p=new URLSearchParams();
  if(c&&c!=="All") p.set("cat",c);
  if(id) p.set("v",id);
  try{history.pushState({cat:c,id},"",p.toString()?"?"+p:location.pathname);}catch(e){}
}

function embedUrl(v){
  if(v.platform==="youtube") return `https://www.youtube.com/embed/${v.id}?autoplay=1&rel=0&modestbranding=1&playsinline=1`;
  return `https://www.dailymotion.com/embed/video/${v.id}?autoplay=1&ui-logo=false&sharing-enable=false`;
}
function thumbUrl(v){
  if(v.thumbnail) return v.thumbnail;
  if(v.platform==="youtube") return `https://img.youtube.com/vi/${v.id}/mqdefault.jpg`;
  return "";
}
function platLbl(p){ return p==="youtube"?"▶ YouTube":"◆ Dailymotion"; }

function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

/* Cat-first playlist — selected cat first, then all others shuffled */
function buildPlaylist(){
  let catV, othV;
  if(cat==="All"){ catV=[]; othV=shuffle([...videos]); }
  else { catV=shuffle(videos.filter(v=>v.category===cat)); othV=shuffle(videos.filter(v=>v.category!==cat)); }
  let ordered=[...catV,...othV];
  if(startVid){
    const i=ordered.findIndex(v=>v.id===startVid);
    if(i>0){const[f]=ordered.splice(i,1);ordered.unshift(f);}
    else if(i===-1){const f=videos.find(v=>v.id===startVid);if(f)ordered.unshift(f);}
  }
  return ordered;
}

/* Theme */
$("themeBtn").onclick=()=>{
  const dark=document.body.getAttribute("data-theme")==="dark";
  document.body.setAttribute("data-theme",dark?"light":"dark");
  $("themeBtn").textContent=dark?"☀️":"🌙";
};
$("backBtn").onclick=e=>{e.preventDefault();window.location.href="https://www.urdutubes.com/p/shorts.html";};

/* Categories */
function buildCatList(vids){ const s=new Set(["All"]); vids.forEach(v=>{if(v.category)s.add(v.category.trim());}); return Array.from(s); }

function renderCats(vids){
  const bar=$("catbar"); bar.innerHTML="";
  const cats=vids&&vids.length?buildCatList(vids):["All"];
  if(!cats.includes(cat)) cat="All";
  cats.forEach(c=>{
    const b=document.createElement("button");
    b.className="cat-pill"+(c===cat?" on":"");
    b.textContent=c;
    b.onclick=()=>{ cat=c; startVid=null; setURL(c,""); renderCats(videos); render(); };
    bar.appendChild(b);
  });
}

/* Render feed */
function render(){
  const el=$("content"); el.innerHTML="";
  if(vObs){vObs.disconnect();vObs=null;} vFeedEl=null;
  posNavBtns();

  const playlist=buildPlaylist();
  if(!playlist.length){
    el.innerHTML=`<div class="state-box"><div class="state-icon">📭</div><div class="state-text">No videos found</div></div>`;
    return;
  }
  renderVertical(el,playlist);
}

/* Vertical feed */
function renderVertical(c,playlist){
  const f=document.createElement("div"); f.className="v-feed"; vFeedEl=f;

  playlist.forEach((v,i)=>{
    const s=document.createElement("div"); s.className="v-slide";
    const tu=thumbUrl(v);

    s.innerHTML=`
      <div class="v-wrap">
        <iframe data-src="${embedUrl(v)}" allow="autoplay;fullscreen;picture-in-picture" allowfullscreen title="${v.title}"></iframe>
        <div class="v-thumb">
          ${tu?`<img src="${tu}" alt="${v.title}" loading="lazy">`:`<div style="position:absolute;inset:0;background:#111"></div>`}
          <div class="v-thumb-play">▶</div>
        </div>
        <div class="v-info">
          <div class="v-tag">${v.category}</div>
          <div class="v-title">${v.title}</div>
        </div>
        <div class="v-plat ${v.platform}">${platLbl(v.platform)}</div>
        <div class="v-side">
          <div class="v-btn" onclick="_share('${v.id}','${v.platform}')">
            <div class="v-icon">↗</div><div class="v-lbl">Share</div>
          </div>
          <div class="v-btn"><div class="v-icon">🔖</div><div class="v-lbl">Save</div></div>
        </div>
        ${i===0?`<div class="scroll-hint"><div class="hint-arrow">↓</div><span>Scroll</span></div>`:""}
      </div>`;

    /* Click thumb → play */
    s.querySelector(".v-thumb").addEventListener("click",function(){
      const iframe=this.closest(".v-wrap").querySelector("iframe");
      if(iframe.dataset.src){iframe.src=iframe.dataset.src;delete iframe.dataset.src;}
      this.style.opacity="0"; setTimeout(()=>{this.style.display="none";},280);
    });

    f.appendChild(s);
  });

  /* Intersection Observer — one video at a time */
  vObs=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      const wrap=entry.target.querySelector(".v-wrap");
      const iframe=wrap?.querySelector("iframe");
      const thumb=wrap?.querySelector(".v-thumb");
      if(!iframe) return;
      if(entry.isIntersecting){
        /* Auto play */
        if(iframe.dataset.src){iframe.src=iframe.dataset.src;delete iframe.dataset.src;}
        if(thumb&&thumb.style.display!=="none"){thumb.style.opacity="0";setTimeout(()=>{if(thumb)thumb.style.display="none";},280);}
      } else {
        /* Pause — stop audio */
        if(iframe.src&&iframe.src!=="about:blank"){
          iframe.dataset.src=iframe.src; iframe.src="about:blank";
          if(thumb){thumb.style.display="flex";thumb.style.opacity="1";}
        }
      }
    });
  },{threshold:0.65});
  f.querySelectorAll(".v-slide").forEach(s=>vObs.observe(s));

  /* Wheel scroll */
  f.addEventListener("wheel",e=>{e.preventDefault();f.scrollBy({top:e.deltaY>0?f.clientHeight:-f.clientHeight,behavior:"smooth"});},{passive:false});
  /* Touch swipe */
  let ty=0;
  f.addEventListener("touchstart",e=>{ty=e.touches[0].clientY;},{passive:true});
  f.addEventListener("touchend",e=>{const d=ty-e.changedTouches[0].clientY;if(Math.abs(d)>40)f.scrollBy({top:d>0?f.clientHeight:-f.clientHeight,behavior:"smooth"});},{passive:true});
  /* Keyboard */
  document.onkeydown=e=>{
    if(!vFeedEl) return;
    if(e.key==="ArrowDown"||e.key==="ArrowRight") vFeedEl.scrollBy({top:vFeedEl.clientHeight,behavior:"smooth"});
    else if(e.key==="ArrowUp"||e.key==="ArrowLeft") vFeedEl.scrollBy({top:-vFeedEl.clientHeight,behavior:"smooth"});
  };

  c.appendChild(f);
}

/* Nav buttons */
$("vNavUp").onclick  =()=>{if(vFeedEl)vFeedEl.scrollBy({top:-vFeedEl.clientHeight,behavior:"smooth"});};
$("vNavDown").onclick=()=>{if(vFeedEl)vFeedEl.scrollBy({top: vFeedEl.clientHeight,behavior:"smooth"});};

function posNavBtns(){
  if(window.innerWidth<=500){$("vNavUp").style.display="none";$("vNavDown").style.display="none";return;}
  $("vNavUp").style.display="flex"; $("vNavDown").style.display="flex";
  const maxW=window.innerWidth>=1400?680:window.innerWidth>=1024?600:window.innerWidth>=768?520:420;
  const vidRight=(window.innerWidth+Math.min(maxW,window.innerWidth))/2;
  const r=Math.max(10,window.innerWidth-vidRight-54)+"px";
  $("vNavUp").style.right=r; $("vNavDown").style.right=r;
}
window.addEventListener("resize",posNavBtns);

/* Share */
window._share=function(id,plat){
  const url=plat==="youtube"?`https://youtu.be/${id}`:`https://dai.ly/${id}`;
  if(navigator.share) navigator.share({url,title:"Watch on UT Shorts"});
  else{navigator.clipboard?.writeText(url);alert("Link copied!");}
};

/* Sheet loader — 2 min cache */
async function loadSheet(){
  try{const c=localStorage.getItem(CACHE_KEY);if(c){const{data,ts}=JSON.parse(c);if(Date.now()-ts<CACHE_TTL&&data.length>0)return data;}}catch(e){}
  const BASE=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${GID}&nc=${Date.now()}`;
  const URLS=[BASE,`https://corsproxy.io/?${encodeURIComponent(BASE)}`,`https://api.allorigins.win/raw?url=${encodeURIComponent(BASE)}`];
  function parse(text){
    try{
      const m=text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*?)\);?\s*$/);if(!m)return null;
      const json=JSON.parse(m[1]);
      return json.table.rows.filter(r=>r.c[0]&&r.c[0].v&&String(r.c[0].v).trim().toLowerCase()!=="video_id").map(r=>({
        id:String(r.c[0].v).trim(), platform:String(r.c[1]?.v||"youtube").toLowerCase().trim(),
        title:String(r.c[2]?.v||"Untitled").trim(), category:String(r.c[3]?.v||"General").trim(),
        description:String(r.c[4]?.v||"").trim().slice(0,150), tags:String(r.c[5]?.v||"").trim(),
        thumbnail:String(r.c[6]?.v||"").trim(), featured:String(r.c[7]?.v||"").toLowerCase().trim()==="yes",
      }));
    }catch(e){return null;}
  }
  function ft(url,ms=10000){return Promise.race([fetch(url,{cache:"no-store"}),new Promise((_,r)=>setTimeout(()=>r(new Error("t")),ms))]);}
  return new Promise(resolve=>{
    let done=false,pending=URLS.length;
    URLS.forEach(url=>{
      ft(url).then(r=>r.text()).then(text=>{
        if(done)return;
        if(text&&text.length>20&&!text.trim().startsWith("<!DOCTYPE")){
          const data=parse(text);
          if(data&&data.length>0){done=true;try{localStorage.setItem(CACHE_KEY,JSON.stringify({data,ts:Date.now()}));}catch(e){}resolve(data);}
        }
      }).catch(()=>{}).finally(()=>{pending--;if(pending===0&&!done)resolve([]);});
    });
  });
}

/* Init */
async function init(){
  $("content").innerHTML=`<div class="state-box"><div class="spinner"></div><div class="state-text">Loading videos…</div></div>`;
  $("vNavUp").style.display="none"; $("vNavDown").style.display="none";
  renderCats([]);
  videos=await loadSheet();
  const{urlCat,urlId}=readURL();
  if(urlCat){const cats=buildCatList(videos);const m=cats.find(c=>c.toLowerCase().replace(/\s+/g,"-")===urlCat.toLowerCase());if(m)cat=m;}
  if(urlId) startVid=urlId;
  if(cat!=="All"){document.title=cat+" Shorts — Urdu Tube";const meta=document.querySelector('meta[name="description"]');if(meta)meta.content="Watch "+cat+" short videos on Urdu Tube Shorts";}
  renderCats(videos); render();
}

window.addEventListener("popstate",e=>{if(e.state){cat=e.state.cat||"All";startVid=e.state.id||null;renderCats(videos);render();}});
init();
})();
