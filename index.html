<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>UT Shorts — Urdu Tube</title>
<meta name="description" content="Watch short videos on Urdu Tube — Islamic, Books, Science, Education and more">
<link rel="icon" href="https://www.urdutubes.com/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

:root {
  --accent:     #7c6af7;
  --accent2:    #f76a8a;
  --accent-rgb: 124,106,247;
  --radius:     14px;
  --ease:       cubic-bezier(.4,0,.2,1);
}

[data-theme="dark"] {
  --bg:      #080810;
  --surface: #13131c;
  --surf2:   #1c1c28;
  --surf3:   #242434;
  --text:    #eeeef8;
  --text2:   #8888aa;
  --border:  rgba(255,255,255,0.07);
  --glass:   rgba(10,10,18,0.92);
}
[data-theme="light"] {
  --bg:      #f2f2fb;
  --surface: #ffffff;
  --surf2:   #eaeaf6;
  --surf3:   #e0e0f0;
  --text:    #111128;
  --text2:   #666688;
  --border:  rgba(0,0,0,0.08);
  --glass:   rgba(242,242,251,0.92);
}

#sitemenu {
  flex-shrink: 0;
  background: #0d0d18;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  overflow-x: auto;
  scrollbar-width: none;
  white-space: nowrap;
}
#sitemenu::-webkit-scrollbar { display: none; }
.sm-inner { display: inline-flex; align-items: center; gap: 2px; padding: 0 10px; min-width: 100%; }
.sm-link { display: inline-block; padding: 7px 12px; color: rgba(255,255,255,0.6); font-size: 0.72rem; font-weight: 500; text-decoration: none; border-radius: 6px; transition: all 0.2s; white-space: nowrap; }
.sm-link:hover { color: #fff; background: rgba(255,255,255,0.07); }
.sm-link.home { color: var(--accent); font-weight: 700; }
.sm-link.home:hover { background: rgba(var(--accent-rgb),0.12); }
.sm-divider { width: 1px; height: 14px; background: rgba(255,255,255,0.1); flex-shrink: 0; margin: 0 2px; }
[data-theme="light"] #sitemenu { background: #1a1a2e; }

html, body { height: 100%; width: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; transition: background .25s var(--ease), color .25s var(--ease); }

#app { display: flex; flex-direction: column; height: 100dvh; width: 100%; overflow: hidden; }

#topbar { flex-shrink: 0; height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); z-index: 50; gap: 10px; }
.back-btn { display: flex; align-items: center; gap: 5px; padding: 6px 12px; border-radius: 20px; background: var(--surf2); border: 1px solid var(--border); color: var(--text2); font-size: 0.78rem; font-weight: 600; cursor: pointer; text-decoration: none; transition: all .2s var(--ease); white-space: nowrap; flex-shrink: 0; }
.back-btn:hover { color: var(--text); border-color: var(--accent); }
.back-btn span { font-size: 1rem; }
.logo { display: flex; align-items: center; flex-shrink: 0; }
.topbar-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.icon-btn { width: 34px; height: 34px; border-radius: 50%; background: var(--surf2); border: 1px solid var(--border); color: var(--text2); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.85rem; transition: all .2s var(--ease); }
.icon-btn:hover { color: var(--text); border-color: var(--accent); }

#catbar { flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 7px 14px; overflow-x: auto; scrollbar-width: none; background: var(--bg); border-bottom: 1px solid var(--border); }
#catbar::-webkit-scrollbar { display: none; }
.cat-pill { flex-shrink: 0; padding: 5px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); color: var(--text2); font-size: 0.76rem; font-weight: 500; cursor: pointer; transition: all .2s var(--ease); white-space: nowrap; }
.cat-pill:hover { color: var(--text); border-color: var(--accent); }
.cat-pill.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

#layoutbar { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 5px 14px; background: var(--bg); border-bottom: 1px solid var(--border); }
.layout-name { font-size: 0.65rem; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--text2); }
.layout-btns { display: flex; gap: 4px; }
.lbtn { width: 30px; height: 30px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); color: var(--text2); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.78rem; transition: all .2s var(--ease); }
.lbtn:hover { color: var(--text); border-color: var(--accent); }
.lbtn.on { background: var(--accent); border-color: var(--accent); color:#fff; }

#content { flex: 1; overflow: hidden; position: relative; background: var(--bg); }

.state-box { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 12px; color: var(--text2); }
.state-icon { font-size: 2.5rem; opacity: .4; }
.state-text { font-size: .88rem; }
.spinner { width: 34px; height: 34px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ═══════════════════════════════════════
   FIX 1 — VERTICAL FEED
   Mobile: full screen like Facebook Reels
   Desktop: big centered player
═══════════════════════════════════════ */
.v-feed {
  height: 100%; width: 100%;
  overflow-y: scroll;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
  position: relative;
}
.v-feed::-webkit-scrollbar { display: none; }

.v-slide {
  height: 100%;
  width: 100%;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  background: var(--bg);
}

/* FIX 1: Big video — TikTok/Facebook Reels style */
.v-wrap {
  width: 100%;
  max-width: 420px;        /* mobile */
  aspect-ratio: 9/16;
  max-height: 100%;
  border-radius: var(--radius);
  overflow: hidden;
  position: relative;
  background: #000;
  box-shadow: 0 0 60px rgba(var(--accent-rgb),.2);
}
/* Desktop boost */
@media (min-width: 768px)  { .v-wrap { max-width: 520px; } }
@media (min-width: 1024px) { .v-wrap { max-width: 600px; } }
@media (min-width: 1400px) { .v-wrap { max-width: 680px; } }

/* Mobile full screen — no padding, no radius, like Facebook Reels */
@media (max-width: 500px) {
  .v-slide { padding: 0; }
  .v-wrap { max-width: 100%; border-radius: 0; }
}

.v-wrap iframe { width:100%; height:100%; border:none; display:block; }

/* Thumbnail overlay for click-to-play */
.v-thumb {
  position: absolute; inset: 0; z-index: 4;
  background: #000;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: opacity .25s;
}
.v-thumb img {
  position: absolute; inset: 0;
  width: 100%; height: 100%; object-fit: cover; opacity: .85;
}
.v-thumb-play {
  position: relative; z-index: 2;
  width: 64px; height: 64px;
  background: rgba(255,255,255,.18);
  backdrop-filter: blur(8px);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px;
  border: 2px solid rgba(255,255,255,.35);
  transition: transform .15s, background .15s;
}
.v-thumb:hover .v-thumb-play { transform: scale(1.1); background: rgba(255,255,255,.28); }

.v-info {
  position: absolute; bottom:0; left:0; right:0;
  padding: 50px 12px 14px;
  background: linear-gradient(to top, rgba(0,0,0,.9) 0%, transparent);
  border-radius: 0 0 var(--radius) var(--radius);
  pointer-events: none;
  z-index: 5;
}
.v-tag { display: inline-block; font-size: .62rem; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--accent); background: rgba(var(--accent-rgb),.18); border: 1px solid rgba(var(--accent-rgb),.3); border-radius: 20px; padding: 2px 9px; margin-bottom: 5px; }
.v-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: .9rem; line-height: 1.3; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.6); }

/* FIX: Side buttons INSIDE v-wrap, next to video */
.v-side {
  position: absolute;
  right: 8px;
  bottom: 60px;
  display: flex; flex-direction: column; gap: 12px; align-items: center;
  z-index: 6;
}

.v-btn { display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; color: rgba(255,255,255,.75); transition: color .15s, transform .15s; }
.v-btn:hover { color:#fff; transform: scale(1.1); }
.v-btn:active { transform: scale(.93); }
.v-icon { width: 38px; height: 38px; background: rgba(255,255,255,.12); backdrop-filter: blur(6px); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: .88rem; border: 1px solid rgba(255,255,255,.1); }
.v-lbl { font-size: .58rem; font-weight: 500; }

.v-plat { position: absolute; top: 9px; right: 9px; font-size: .6rem; font-weight: 600; letter-spacing: .3px; padding: 2px 8px; border-radius: 20px; pointer-events: none; z-index: 6; }
.v-plat.youtube     { background: rgba(255,0,0,.2); color:#ff6b6b; border:1px solid rgba(255,0,0,.2); }
.v-plat.dailymotion { background: rgba(0,148,255,.2); color:#5bc4ff; border:1px solid rgba(0,148,255,.2); }

/* UP/DOWN arrow buttons — fixed, right next to video */
.v-nav-btn {
  position: fixed;
  right: 14px;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: rgba(var(--accent-rgb), 0.85);
  border: none; color: #fff; font-size: 20px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 200;
  box-shadow: 0 4px 16px rgba(var(--accent-rgb),.4);
  transition: transform .15s, background .15s;
  user-select: none;
}
.v-nav-btn:hover  { transform: scale(1.08); background: rgba(var(--accent-rgb),1); }
.v-nav-btn:active { transform: scale(.92); }
#vNavUp   { bottom: 76px; }
#vNavDown { bottom: 24px; }

/* On desktop — position arrows right next to the video */
@media (min-width: 501px) {
  .v-nav-btn {
    /* Will be repositioned by JS to be right beside video */
    right: auto;
  }
  #vNavUp   { bottom: 50%; margin-bottom: 28px; }
  #vNavDown { bottom: 50%; margin-top: 28px; top: 50%; }
}

.scroll-hint { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 2px; color: rgba(255,255,255,.3); font-size: .62rem; animation: hintFade 3s ease forwards 2.5s; pointer-events: none; z-index: 7; }
.hint-arrow { animation: bounce 1s ease infinite; font-size: .9rem; }
@keyframes bounce  { 0%,100%{transform:translateY(0)} 50%{transform:translateY(3px)} }
@keyframes hintFade{ 0%{opacity:1} 100%{opacity:0} }

/* ── GRID ── */
.grid-feed { height: 100%; overflow-y: auto; padding: 10px; display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; align-content: start; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
@media(min-width:500px){ .grid-feed{ grid-template-columns: repeat(3,1fr); } }
@media(min-width:800px){ .grid-feed{ grid-template-columns: repeat(4,1fr); } }
.g-card { border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); overflow: hidden; cursor: pointer; transition: transform .2s var(--ease), box-shadow .2s; animation: fadeUp .35s ease both; }
.g-card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(var(--accent-rgb),.15); }
.g-thumb { aspect-ratio:16/9; background:var(--surf2); position:relative; overflow:hidden; }
.g-thumb iframe { width:100%; height:100%; border:none; pointer-events:none; }
.g-overlay { position:absolute; inset:0; background:rgba(0,0,0,.28); display:flex; align-items:center; justify-content:center; transition:background .2s; }
.g-card:hover .g-overlay { background:rgba(0,0,0,.08); }
.g-play { width:38px; height:38px; background:rgba(var(--accent-rgb),.9); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1rem; transition:transform .15s; }
.g-card:hover .g-play { transform:scale(1.12); }
.g-body { padding:8px 10px 10px; }
.g-cat   { font-size:.6rem; font-weight:700; letter-spacing:.7px; text-transform:uppercase; color:var(--accent); margin-bottom:3px; }
.g-title { font-weight:600; font-size:.78rem; line-height:1.3; color:var(--text); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.g-plat  { font-size:.6rem; color:var(--text2); margin-top:4px; }

/* ── SWIPE ── */
.swipe-wrap { height: 100%; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 14px; }
.swipe-stack { position: relative; width: 100%; max-width: 360px; height: min(420px, 55vh); margin: 0 auto; flex-shrink: 0; }
.s-card { position: absolute; inset:0; background: var(--surface); border-radius: 18px; border: 1px solid var(--border); overflow: hidden; box-shadow: 0 6px 30px rgba(0,0,0,.25); transition: transform .3s ease, opacity .3s ease; cursor: grab; }
.s-card:nth-child(2){ transform:translateY(7px) scale(.97); opacity:.7; }
.s-card:nth-child(3){ transform:translateY(14px) scale(.94); opacity:.4; }
.s-card:nth-child(n+4){ opacity:0; pointer-events:none; }
.s-card.drag { cursor:grabbing; transition:none; z-index:10; }
.s-card.fl   { transform:translateX(-130%) rotate(-15deg) !important; opacity:0 !important; }
.s-card.fr   { transform:translateX(130%)  rotate(15deg)  !important; opacity:0 !important; }
.s-thumb { height:55%; background:#000; overflow:hidden; }
.s-thumb iframe { width:100%; height:100%; border:none; }
.s-body  { padding:12px 14px; }
.s-cat   { font-size:.62rem; font-weight:700; letter-spacing:.7px; text-transform:uppercase; color:var(--accent); margin-bottom:4px; }
.s-title { font-weight:700; font-size:.9rem; line-height:1.3; color:var(--text); }
.s-plat  { font-size:.65rem; color:var(--text2); margin-top:5px; }
.swipe-btns { display:flex; gap:16px; align-items:center; justify-content:center; flex-shrink:0; }
.s-btn { width:50px; height:50px; border-radius:50%; border:2px solid var(--border); background:var(--surface); display:flex; align-items:center; justify-content:center; font-size:1.2rem; cursor:pointer; transition: all .2s; box-shadow:0 4px 14px rgba(0,0,0,.15); }
.s-btn.skip  { border-color:#f76a8a; }
.s-btn.skip:hover  { background:#f76a8a; transform:scale(1.1); }
.s-btn.save  { border-color:var(--accent); }
.s-btn.save:hover  { background:var(--accent); transform:scale(1.1); }
.s-btn.watch { border-color:#4caf90; width:60px; height:60px; font-size:1.3rem; }
.s-btn.watch:hover { background:#4caf90; transform:scale(1.1); }
.s-ctr { font-size:.75rem; color:var(--text2); font-weight:500; text-align:center; flex-shrink:0; }

/* ── CINEMA ── */
.cinema-wrap { height: 100%; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
@media(min-width:680px){ .cinema-wrap{ flex-direction:row; } }
.c-main { flex:1; background:var(--surface); border-radius:var(--radius); overflow:hidden; border:1px solid var(--border); flex-shrink:0; }
.c-thumb { aspect-ratio:16/9; background:#000; }
.c-thumb iframe { width:100%; height:100%; border:none; }
.c-meta  { padding:10px 14px 14px; }
.c-cat   { font-size:.62rem; font-weight:700; letter-spacing:.7px; text-transform:uppercase; color:var(--accent); margin-bottom:4px; }
.c-title { font-weight:700; font-size:.95rem; line-height:1.35; color:var(--text); margin-bottom:8px; }
.c-acts  { display:flex; gap:6px; flex-wrap:wrap; }
.c-act   { padding:5px 12px; border-radius:20px; border:1px solid var(--border); background:var(--surf2); color:var(--text2); font-size:.72rem; font-weight:500; cursor:pointer; transition:all .2s; }
.c-act:hover { border-color:var(--accent); color:var(--text); }
.c-list { width:100%; display:flex; flex-direction:column; gap:6px; max-height:300px; overflow-y:auto; scrollbar-width:thin; scrollbar-color:var(--border) transparent; }
@media(min-width:680px){ .c-list{ width:260px; max-height:none; flex-shrink:0; } }
.c-item { display:flex; gap:8px; align-items:flex-start; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:8px; cursor:pointer; transition:all .2s; }
.c-item:hover { border-color:var(--accent); background:var(--surf2); }
.c-item.on    { border-color:var(--accent); background:rgba(var(--accent-rgb),.08); }
.c-ithumb { width:70px; height:42px; flex-shrink:0; border-radius:7px; overflow:hidden; background:var(--surf2); position:relative; }
.c-ithumb iframe { width:100%; height:100%; border:none; pointer-events:none; }
.c-itover { position:absolute; inset:0; background:rgba(0,0,0,.22); display:flex; align-items:center; justify-content:center; font-size:.75rem; color:#fff; }
.c-iinfo  { flex:1; min-width:0; }
.c-icat   { font-size:.57rem; font-weight:700; letter-spacing:.6px; text-transform:uppercase; color:var(--accent); margin-bottom:2px; }
.c-ititle { font-weight:600; font-size:.72rem; line-height:1.3; color:var(--text); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.c-iplat  { font-size:.58rem; color:var(--text2); margin-top:3px; }

/* ── MAGAZINE ── */
.mag-feed { height:100%; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:10px; scrollbar-width:thin; scrollbar-color:var(--border) transparent; }
.m-card { display:flex; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; cursor:pointer; transition:all .2s; animation: fadeUp .35s ease both; }
.m-card:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(var(--accent-rgb),.12); border-color:rgba(var(--accent-rgb),.3); }
.m-card:nth-child(odd)  { flex-direction:row; }
.m-card:nth-child(even) { flex-direction:row-reverse; }
.m-thumb { width:120px; flex-shrink:0; background:var(--surf2); position:relative; overflow:hidden; }
.m-thumb iframe { width:178%; height:100%; border:none; margin-left:-39%; pointer-events:none; }
.m-overlay { position:absolute; inset:0; background:rgba(0,0,0,.22); display:flex; align-items:center; justify-content:center; transition:background .2s; }
.m-card:hover .m-overlay { background:rgba(0,0,0,.05); }
.m-play { width:34px; height:34px; background:rgba(var(--accent-rgb),.85); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.8rem; transition:transform .15s; }
.m-card:hover .m-play { transform:scale(1.15); }
.m-body  { flex:1; padding:12px 14px; display:flex; flex-direction:column; justify-content:center; }
.m-row   { display:flex; align-items:center; gap:6px; margin-bottom:5px; }
.m-cat   { font-size:.6rem; font-weight:700; letter-spacing:.7px; text-transform:uppercase; color:var(--accent); background:rgba(var(--accent-rgb),.1); border-radius:20px; padding:2px 7px; }
.m-plat  { font-size:.6rem; color:var(--text2); font-weight:500; }
.m-title { font-weight:700; font-size:.88rem; line-height:1.3; color:var(--text); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.m-arrow { font-size:.9rem; color:var(--text2); margin-top:8px; transition:transform .2s, color .2s; }
.m-card:hover .m-arrow { transform:translateX(4px); color:var(--accent); }

/* ── MODAL ── */
#modal { display:none; position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,.9); backdrop-filter:blur(10px); align-items:center; justify-content:center; padding:16px; }
#modal.open { display:flex; }
.modal-box { width:100%; max-width:500px; background:#13131c; border-radius:20px; overflow:hidden; border:1px solid rgba(255,255,255,.08); animation: popIn .22s var(--ease); position:relative; }
.modal-iframe { aspect-ratio:16/9; background:#000; }
.modal-iframe iframe { width:100%; height:100%; border:none; }
.modal-meta  { padding:12px 16px 16px; }
.modal-cat   { font-size:.62rem; font-weight:700; letter-spacing:.7px; text-transform:uppercase; color:var(--accent); margin-bottom:5px; }
.modal-title { font-weight:700; font-size:.95rem; line-height:1.4; color:#eeeef8; }
.modal-desc  { font-size:.78rem; color:rgba(238,238,248,0.6); margin-top:6px; line-height:1.5; }
.modal-close { position:absolute; top:10px; right:10px; width:30px; height:30px; background:rgba(0,0,0,.5); border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:.85rem; color:#fff; border:none; z-index:2; }

@keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
@keyframes popIn  { from{transform:scale(.9);opacity:0} to{transform:scale(1);opacity:1} }
</style>
</head>
<body data-theme="dark">

<div id="app">
  <!-- Site Menu -->
  <div id="sitemenu">
    <div class="sm-inner">

<script>
(function(){
'use strict';

/* ════ CONFIG ════ */
const SHEET_CSV  = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRcsxQ0Cx9Z0mJjC8zh-No0U7KeYRvX5D5BfTg2o-PrsNzb7I2CRYQD2bRP7BbPi_z4M9WRNgH5E8t0/pub?gid=102941964&single=true&output=csv";
const SHEET_ID   = "1tj3xg0toFl8vT_O0SFQY2inq6XZqKRSqPMGlgcbLXMI";
const GID        = "102941964";
const CACHE_KEY  = "uta_shorts_v5";
const CACHE_TTL  = 2 * 60 * 1000; /* ✅ FIX 3: 2 minutes */
const L_NAMES    = { vertical:"Vertical Scroll", grid:"Grid View", swipe:"Card Swipe", cinema:"Cinema Mode", magazine:"Magazine" };

/* ════ STATE ════ */
let videos=[], cat="All", layout="vertical", cinIdx=0, swIdx=0;
let startVid = null; /* ✅ FIX 2: video to play first */
let vFeedEl  = null;
let vObserver = null;

/* ════ URL PARAMS ════ */
function readURL(){
  const path   = window.location.pathname.replace(/^\//, "").split("/").filter(Boolean);
  const params = new URLSearchParams(window.location.search);
  let urlCat = "", urlId = "";
  if(params.get("cat")) urlCat = decodeURIComponent(params.get("cat"));
  if(params.get("v"))   urlId  = decodeURIComponent(params.get("v"));
  if(!urlCat && path[0] && path[0] !== "index.html") urlCat = path[0];
  if(!urlId  && path[1]) urlId = path[1];
  return { urlCat, urlId };
}

function setCleanURL(c, id){
  const p = new URLSearchParams();
  if(c && c!=="All") p.set("cat", c);
  if(id) p.set("v", id);
  try{ history.pushState({cat:c,id}, "", p.toString() ? "?"+p : location.pathname); }catch(e){}
}

/* ════ HELPERS ════ */
const $ = id => document.getElementById(id);

function embedUrl(v, auto=0){
  if(v.platform==="youtube")
    return `https://www.youtube.com/embed/${v.id}?autoplay=${auto}&rel=0&modestbranding=1&playsinline=1`;
  return `https://www.dailymotion.com/embed/video/${v.id}?autoplay=${auto}&ui-logo=false&sharing-enable=false`;
}
function platLbl(p){ return p==="youtube"?"▶ YouTube":"◆ Dailymotion"; }
function thumbUrl(v){
  if(v.thumbnail) return v.thumbnail;
  if(v.platform==="youtube") return `https://img.youtube.com/vi/${v.id}/mqdefault.jpg`;
  return "";
}

/* ✅ FIX 2: Build ordered playlist — cat-first then rest shuffled */
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function buildPlaylist(allVids, activeCat, firstVideoId){
  let catVids, otherVids;
  if(activeCat==="All"){
    catVids   = [];
    otherVids = shuffle([...allVids]);
  } else {
    catVids   = shuffle(allVids.filter(v => v.category === activeCat));
    otherVids = shuffle(allVids.filter(v => v.category !== activeCat));
  }
  let ordered = [...catVids, ...otherVids];

  /* Put clicked video first */
  if(firstVideoId){
    const idx = ordered.findIndex(v => v.id === firstVideoId);
    if(idx > 0){
      const [found] = ordered.splice(idx, 1);
      ordered.unshift(found);
    } else if(idx === -1){
      const found = allVids.find(v => v.id === firstVideoId);
      if(found) ordered.unshift(found);
    }
  }
  return ordered;
}

function filtered(){
  /* For non-vertical layouts — simple filter */
  return cat==="All" ? videos : videos.filter(v=>v.category===cat);
}

/* ════ THEME ════ */
$("themeBtn").onclick = () => {
  const dark = document.body.getAttribute("data-theme")==="dark";
  document.body.setAttribute("data-theme", dark?"light":"dark");
  $("themeBtn").textContent = dark?"☀️":"🌙";
};

/* ════ BACK ════ */
$("backBtn").onclick = e => {
  e.preventDefault();
  window.location.href = "https://www.urdutubes.com/p/shorts.html";
};

/* ════ CATEGORIES ════ */
function buildCatList(vids){
  const seen = new Set(["All"]);
  vids.forEach(v => { if(v.category) seen.add(v.category.trim()); });
  return Array.from(seen);
}

function renderCats(vids){
  const bar = $("catbar"); bar.innerHTML="";
  const cats = vids && vids.length ? buildCatList(vids) : ["All"];
  if(!cats.includes(cat)) cat="All";
  cats.forEach(c=>{
    const b=document.createElement("button");
    b.className="cat-pill"+(c===cat?" on":"");
    b.textContent=c;
    b.onclick=()=>{
      cat=c; cinIdx=0; swIdx=0; startVid=null;
      setCleanURL(c,"");
      renderCats(videos);
      render();
    };
    bar.appendChild(b);
  });
}

/* ════ LAYOUT SWITCHER ════ */
$("lbtns").addEventListener("click", e=>{
  const b=e.target.closest(".lbtn"); if(!b) return;
  document.querySelectorAll(".lbtn").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");
  layout=b.dataset.l;
  $("lname").textContent=L_NAMES[layout];
  cinIdx=0; swIdx=0;
  render();
  positionNavBtns();
});

/* ════ MODAL ════ */
function openModal(v){
  $("mIframe").innerHTML=`<iframe src="${embedUrl(v,1)}" allow="autoplay;fullscreen;picture-in-picture" allowfullscreen loading="lazy"></iframe>`;
  $("mCat").textContent=v.category;
  $("mTitle").textContent=v.title;
  $("mDesc").textContent=v.description||"";
  setCleanURL(v.category, v.id);
  $("modal").classList.add("open");
}
function closeModal(){
  $("modal").classList.remove("open");
  $("mIframe").innerHTML="";
}
$("mClose").onclick=closeModal;
$("modal").onclick=e=>{ if(e.target.id==="modal") closeModal(); };

/* ════ POSITION NAV BUTTONS beside video ════ */
function positionNavBtns(){
  const up   = $("vNavUp");
  const down = $("vNavDown");
  const show = layout==="vertical";
  up.style.display   = show?"flex":"none";
  down.style.display = show?"flex":"none";
  if(!show) return;

  if(window.innerWidth > 500){
    /* Desktop: position right beside the video wrap */
    const content = $("content");
    const cr = content.getBoundingClientRect();
    const wrapW = Math.min(
      window.innerWidth>=1400?680:window.innerWidth>=1024?600:window.innerWidth>=768?520:420,
      cr.width
    );
    const rightEdge = cr.left + (cr.width + wrapW) / 2;
    const btnRight  = window.innerWidth - rightEdge - 56;
    up.style.right   = Math.max(8, btnRight) + "px";
    down.style.right = Math.max(8, btnRight) + "px";
    up.style.bottom   = "calc(50% + 28px)";
    down.style.bottom = "calc(50% - 72px)";
  } else {
    /* Mobile: fixed right side */
    up.style.right   = "10px";
    down.style.right = "10px";
    up.style.bottom   = "76px";
    down.style.bottom = "24px";
  }
}

/* ════ RENDER ════ */
function render(){
  const el=$("content"); el.innerHTML="";
  if(vObserver){ vObserver.disconnect(); vObserver=null; }
  vFeedEl=null;

  if(layout==="vertical"){
    /* ✅ FIX 2: use cat-first playlist */
    const playlist = buildPlaylist(videos, cat, startVid);
    if(!playlist.length){
      el.innerHTML=`<div class="state-box"><div class="state-icon">📭</div><div class="state-text">No videos</div></div>`;
      return;
    }
    renderVertical(el, playlist);
  } else {
    const vids=filtered();
    if(!vids.length){
      el.innerHTML=`<div class="state-box"><div class="state-icon">📭</div><div class="state-text">No videos in this category</div></div>`;
      return;
    }
    if(layout==="grid")        renderGrid(el,vids);
    else if(layout==="swipe")  renderSwipe(el,vids);
    else if(layout==="cinema") renderCinema(el,vids);
    else                       renderMag(el,vids);
  }

  positionNavBtns();
}

/* ════ L1: VERTICAL — with click-to-play & cat-first ════ */
function renderVertical(c, playlist){
  const f=document.createElement("div"); f.className="v-feed";
  vFeedEl = f;

  playlist.forEach((v,i)=>{
    const s=document.createElement("div"); s.className="v-slide";

    /* Thumbnail overlay */
    const tu = thumbUrl(v);
    const thumbHtml = tu
      ? `<div class="v-thumb" data-idx="${i}">
           <img src="${tu}" alt="${v.title}" loading="lazy">
           <div class="v-thumb-play">▶</div>
         </div>`
      : `<div class="v-thumb" data-idx="${i}" style="background:#111">
           <div class="v-thumb-play">▶</div>
         </div>`;

    s.innerHTML=`
      <div class="v-wrap">
        <iframe data-src="${embedUrl(v,1)}" allow="autoplay;fullscreen;picture-in-picture" allowfullscreen title="${v.title}"></iframe>
        ${thumbHtml}
        <div class="v-info">
          <div class="v-tag">${v.category}</div>
          <div class="v-title">${v.title}</div>
        </div>
        <div class="v-plat ${v.platform}">${platLbl(v.platform)}</div>
        <div class="v-side">
          <div class="v-btn" onclick='_openM(${JSON.stringify(v)})'>
            <div class="v-icon">▶</div><div class="v-lbl">Watch</div>
          </div>
          <div class="v-btn" onclick="_share('${v.id}','${v.platform}')">
            <div class="v-icon">↗</div><div class="v-lbl">Share</div>
          </div>
          <div class="v-btn"><div class="v-icon">🔖</div><div class="v-lbl">Save</div></div>
        </div>
        ${i===0?`<div class="scroll-hint"><div class="hint-arrow">↓</div><span>Scroll</span></div>`:""}
      </div>`;

    /* Click thumb → play */
    s.querySelector(".v-thumb").addEventListener("click", function(){
      const wrap   = this.closest(".v-wrap");
      const iframe = wrap.querySelector("iframe");
      if(iframe.dataset.src){
        iframe.src = iframe.dataset.src;
        delete iframe.dataset.src;
      }
      this.style.opacity = "0";
      setTimeout(()=>{ this.style.display="none"; }, 280);
    });

    f.appendChild(s);
  });

  /* Intersection Observer — auto play visible slide, pause others */
  vObserver = new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      const wrap   = entry.target.querySelector(".v-wrap");
      const iframe = wrap?.querySelector("iframe");
      const thumb  = wrap?.querySelector(".v-thumb");
      if(!iframe) return;

      if(entry.isIntersecting){
        /* Load and auto-play */
        if(iframe.dataset.src){
          iframe.src = iframe.dataset.src;
          delete iframe.dataset.src;
        }
        /* Hide thumb */
        if(thumb && thumb.style.display!=="none"){
          thumb.style.opacity="0";
          setTimeout(()=>{ if(thumb) thumb.style.display="none"; }, 280);
        }
      } else {
        /* Pause — reset to blank */
        if(iframe.src && iframe.src!=="about:blank"){
          iframe.dataset.src = iframe.src;
          iframe.src = "about:blank";
          /* Show thumb again */
          if(thumb){
            thumb.style.display="flex";
            thumb.style.opacity="1";
          }
        }
      }
    });
  },{ threshold: 0.65 });

  f.querySelectorAll(".v-slide").forEach(s => vObserver.observe(s));

  /* Wheel scroll */
  f.addEventListener("wheel", e=>{
    e.preventDefault();
    f.scrollBy({top: e.deltaY>0 ? f.clientHeight : -f.clientHeight, behavior:"smooth"});
  },{passive:false});

  /* Touch swipe */
  let ty=0;
  f.addEventListener("touchstart", e=>{ ty=e.touches[0].clientY; },{passive:true});
  f.addEventListener("touchend",   e=>{
    const diff = ty - e.changedTouches[0].clientY;
    if(Math.abs(diff)>40)
      f.scrollBy({top: diff>0 ? f.clientHeight : -f.clientHeight, behavior:"smooth"});
  },{passive:true});

  /* Keyboard */
  document.onkeydown = e=>{
    if(!vFeedEl) return;
    if(e.key==="ArrowDown"||e.key==="ArrowRight")
      vFeedEl.scrollBy({top: vFeedEl.clientHeight, behavior:"smooth"});
    else if(e.key==="ArrowUp"||e.key==="ArrowLeft")
      vFeedEl.scrollBy({top:-vFeedEl.clientHeight, behavior:"smooth"});
  };

  c.appendChild(f);
}

/* ── NAV BUTTONS ── */
$("vNavUp").onclick   = ()=>{ if(vFeedEl) vFeedEl.scrollBy({top:-vFeedEl.clientHeight,behavior:"smooth"}); };
$("vNavDown").onclick = ()=>{ if(vFeedEl) vFeedEl.scrollBy({top: vFeedEl.clientHeight,behavior:"smooth"}); };

/* ════ L2: GRID ════ */
function renderGrid(c,vids){
  const g=document.createElement("div"); g.className="grid-feed";
  vids.forEach((v,i)=>{
    const d=document.createElement("div");
    d.className="g-card"; d.style.animationDelay=`${i*0.04}s`;
    d.innerHTML=`
      <div class="g-thumb">
        <iframe src="${embedUrl(v)}" loading="lazy" allowfullscreen title="${v.title}"></iframe>
        <div class="g-overlay"><div class="g-play">▶</div></div>
      </div>
      <div class="g-body">
        <div class="g-cat">${v.category}</div>
        <div class="g-title">${v.title}</div>
        <div class="g-plat">${platLbl(v.platform)}</div>
      </div>`;
    d.onclick=()=>{
      /* ✅ FIX 2: clicking grid card → that video plays first in vertical */
      startVid = v.id;
      cat = v.category;
      layout = "vertical";
      document.querySelectorAll(".lbtn").forEach(x=>x.classList.remove("on"));
      document.querySelector('.lbtn[data-l="vertical"]').classList.add("on");
      $("lname").textContent = L_NAMES["vertical"];
      renderCats(videos);
      render();
    };
    g.appendChild(d);
  });
  c.appendChild(g);
}

/* ════ L3: SWIPE ════ */
function renderSwipe(c,vids){
  const w=document.createElement("div"); w.className="swipe-wrap";
  const ctr=document.createElement("div"); ctr.className="s-ctr"; ctr.id="sCtr";
  const stk=document.createElement("div"); stk.className="swipe-stack"; stk.id="sStk";
  const btns=document.createElement("div"); btns.className="swipe-btns";
  btns.innerHTML=`
    <button class="s-btn skip"  onclick="_swipe('l')">✕</button>
    <button class="s-btn watch" onclick="_watchCur()">▶</button>
    <button class="s-btn save"  onclick="_swipe('r')">🔖</button>`;
  w.appendChild(ctr); w.appendChild(stk); w.appendChild(btns);
  c.appendChild(w);
  buildSwipe(vids);
}
window._swipe=function(dir){
  const stk=$("sStk"); if(!stk) return;
  const top=stk.firstElementChild; if(!top||!top.classList.contains("s-card")) return;
  top.classList.add(dir==="l"?"fl":"fr");
  setTimeout(()=>{ swIdx++; buildSwipe(filtered()); },280);
};
window._watchCur=function(){ const v=filtered()[swIdx]; if(v) openModal(v); };
function buildSwipe(vids){
  const stk=$("sStk"); if(!stk) return; stk.innerHTML="";
  const ctr=$("sCtr"); if(ctr) ctr.textContent=`${Math.min(swIdx+1,vids.length)} / ${vids.length}`;
  const sl=vids.slice(swIdx,swIdx+4);
  if(!sl.length){ stk.innerHTML=`<div class="state-box"><div class="state-icon">🎉</div><div class="state-text">All done!</div></div>`; return; }
  sl.forEach((v,i)=>{
    const d=document.createElement("div"); d.className="s-card"; d.style.zIndex=sl.length-i;
    d.innerHTML=`
      <div class="s-thumb"><iframe src="${embedUrl(v)}" loading="lazy" allowfullscreen title="${v.title}"></iframe></div>
      <div class="s-body">
        <div class="s-cat">${v.category}</div>
        <div class="s-title">${v.title}</div>
        <div class="s-plat">${platLbl(v.platform)}</div>
      </div>`;
    stk.appendChild(d);
  });
  addDrag(stk.firstElementChild,vids);
}
function addDrag(card,vids){
  if(!card) return;
  let sx=0,cx=0,drag=false;
  card.addEventListener("mousedown",e=>{sx=e.clientX;drag=true;card.classList.add("drag");});
  card.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;drag=true;},{passive:true});
  document.addEventListener("mousemove",e=>{if(!drag)return;cx=e.clientX-sx;card.style.transform=`translateX(${cx}px) rotate(${cx*.05}deg)`;});
  document.addEventListener("touchmove",e=>{if(!drag)return;cx=e.touches[0].clientX-sx;card.style.transform=`translateX(${cx}px) rotate(${cx*.05}deg)`;},{passive:true});
  const end=()=>{ if(!drag)return; drag=false; card.classList.remove("drag"); if(Math.abs(cx)>70) _swipe(cx>0?"r":"l"); else card.style.transform=""; cx=0; };
  document.addEventListener("mouseup",end);
  document.addEventListener("touchend",end);
}

/* ════ L4: CINEMA ════ */
function renderCinema(c,vids){
  const w=document.createElement("div"); w.className="cinema-wrap";
  const main=document.createElement("div"); main.className="c-main"; main.id="cMain";
  const list=document.createElement("div"); list.className="c-list"; list.id="cList";
  w.appendChild(main); w.appendChild(list); c.appendChild(w);
  buildCinMain(vids); buildCinList(vids);
}
function buildCinMain(vids){
  const v=vids[cinIdx]; const el=$("cMain"); if(!el||!v) return;
  el.innerHTML=`
    <div class="c-thumb"><iframe src="${embedUrl(v,1)}" allow="autoplay;fullscreen" allowfullscreen loading="lazy"></iframe></div>
    <div class="c-meta">
      <div class="c-cat">${v.category} · ${platLbl(v.platform)}</div>
      <div class="c-title">${v.title}</div>
      <div class="c-acts">
        <button class="c-act" onclick="_share('${v.id}','${v.platform}')">↗ Share</button>
        <button class="c-act">🔖 Save</button>
        <button class="c-act" onclick="_cinNav(-1)">← Prev</button>
        <button class="c-act" onclick="_cinNav(1)">Next →</button>
      </div>
    </div>`;
}
function buildCinList(vids){
  const el=$("cList"); if(!el) return; el.innerHTML="";
  vids.forEach((v,i)=>{
    const d=document.createElement("div");
    d.className="c-item"+(i===cinIdx?" on":"");
    d.innerHTML=`
      <div class="c-ithumb">
        <iframe src="${embedUrl(v)}" loading="lazy" allowfullscreen title="${v.title}"></iframe>
        <div class="c-itover">${i===cinIdx?"▶":"▷"}</div>
      </div>
      <div class="c-iinfo">
        <div class="c-icat">${v.category}</div>
        <div class="c-ititle">${v.title}</div>
        <div class="c-iplat">${platLbl(v.platform)}</div>
      </div>`;
    d.onclick=()=>{ cinIdx=i; buildCinMain(vids); buildCinList(vids); };
    el.appendChild(d);
  });
}
window._cinNav=function(dir){ const vids=filtered(); cinIdx=Math.max(0,Math.min(vids.length-1,cinIdx+dir)); buildCinMain(vids); buildCinList(vids); };

/* ════ L5: MAGAZINE ════ */
function renderMag(c,vids){
  const f=document.createElement("div"); f.className="mag-feed";
  vids.forEach((v,i)=>{
    const d=document.createElement("div");
    d.className="m-card"; d.style.animationDelay=`${i*0.04}s`;
    d.innerHTML=`
      <div class="m-thumb">
        <iframe src="${embedUrl(v)}" loading="lazy" allowfullscreen title="${v.title}"></iframe>
        <div class="m-overlay"><div class="m-play">▶</div></div>
      </div>
      <div class="m-body">
        <div class="m-row">
          <span class="m-cat">${v.category}</span>
          <span class="m-plat">${platLbl(v.platform)}</span>
        </div>
        <div class="m-title">${v.title}</div>
        <div class="m-arrow">→</div>
      </div>`;
    d.onclick=()=>openModal(v);
    f.appendChild(d);
  });
  c.appendChild(f);
}

/* ════ SHARE ════ */
window._share=function(id,plat){
  const url=plat==="youtube"?`https://youtu.be/${id}`:`https://dai.ly/${id}`;
  if(navigator.share) navigator.share({url,title:"Watch on UT Shorts"});
  else { navigator.clipboard?.writeText(url); alert("Link copied!"); }
};
window._openM=function(v){ openModal(v); };

/* ════ SHEET LOADER — with 2min cache ════ */
async function loadSheet(){
  /* ✅ FIX 3: 2 min cache */
  try{
    const c=localStorage.getItem(CACHE_KEY);
    if(c){
      const {data,ts}=JSON.parse(c);
      if(Date.now()-ts < CACHE_TTL && data.length>0) return data;
    }
  }catch(e){}

  const JSON_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${GID}&nocache=${Date.now()}`;

  try{
    const res  = await fetch(JSON_URL, {cache:"no-store"});
    const text = await res.text();
    const json = JSON.parse(text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*?)\);?$/)[1]);
    const data = json.table.rows
      .filter(r=>r.c[0]&&r.c[0].v&&String(r.c[0].v).trim().toLowerCase()!=="video_id")
      .map(r=>({
        id:          String(r.c[0].v).trim(),
        platform:    String(r.c[1]?.v||"youtube").toLowerCase().trim(),
        title:       String(r.c[2]?.v||"Untitled").trim(),
        category:    String(r.c[3]?.v||"General").trim(),
        description: String(r.c[4]?.v||"").trim().slice(0,150),
        tags:        String(r.c[5]?.v||"").trim(),
        thumbnail:   String(r.c[6]?.v||"").trim(),
      }));
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify({data,ts:Date.now()})); }catch(e){}
    return data;
  }catch(e){
    /* Fallback CSV proxy */
    try{
      const proxy="https://corsproxy.io/?"+encodeURIComponent(SHEET_CSV);
      const res=await fetch(proxy,{cache:"no-cache"});
      const text=await res.text();
      const rows=text.trim().split("\n").map(r=>{
        const cols=[]; let cur="",inQ=false;
        for(let ch of r){ if(ch==='"'){inQ=!inQ;} else if(ch===','&&!inQ){cols.push(cur.trim());cur="";}else{cur+=ch;} }
        cols.push(cur.trim()); return cols;
      });
      rows.shift();
      const data=rows.filter(r=>r[0]&&r[0].length>1).map(r=>({
        id:r[0]||"", platform:(r[1]||"youtube").toLowerCase().trim(),
        title:r[2]||"Untitled", category:r[3]||"General",
        description:r[4]||"", thumbnail:r[6]||"",
      }));
      try{ localStorage.setItem(CACHE_KEY, JSON.stringify({data,ts:Date.now()})); }catch(e){}
      return data;
    }catch(e2){ return []; }
  }
}

/* ════ INIT ════ */
async function init(){
  $("content").innerHTML=`<div class="state-box"><div class="spinner"></div><div class="state-text">Loading videos…</div></div>`;
  renderCats([]);
  $("vNavUp").style.display="none";
  $("vNavDown").style.display="none";

  videos = await loadSheet();

  const { urlCat, urlId } = readURL();
  if(urlCat){
    const allCats=buildCatList(videos);
    const matched=allCats.find(c=>c.toLowerCase().replace(/\s+/g,"-")===urlCat.toLowerCase());
    if(matched) cat=matched;
  }
  /* ✅ FIX 2: set startVid from URL */
  if(urlId) startVid = urlId;

  if(cat!=="All"){
    document.title=cat+" Shorts — Urdu Tube";
    const meta=document.querySelector('meta[name="description"]');
    if(meta) meta.content="Watch "+cat+" short videos on Urdu Tube Shorts";
  }

  renderCats(videos);
  render();

  /* Reposition nav on resize */
  window.addEventListener("resize", ()=>{ if(layout==="vertical") positionNavBtns(); });
}

window.addEventListener("popstate", e => {
  if(e.state){ cat=e.state.cat||"All"; startVid=e.state.id||null; renderCats(videos); render(); }
});

init();
})();
</script>
